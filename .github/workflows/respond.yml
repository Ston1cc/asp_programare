name: Raspunde la comenzi Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: asp-respond
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica si raspunde la comenzi
        env:
          ASP_IDNP: ${{ secrets.ASP_IDNP }}
          ASP_DOC_SERIES: ${{ secrets.ASP_DOC_SERIES }}
          ASP_DOC_ISSUE_DATE: ${{ secrets.ASP_DOC_ISSUE_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/respond.js

      - name: Commit state
        run: |
          git config user.name "asp-programare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/telegram.json
          git diff --staged --quiet && exit 0
          git commit -m "state: update telegram offset [skip ci]"
          git pull --rebase origin master
          git push
