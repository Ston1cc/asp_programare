name: Verifica locuri ASP

on:
  schedule:
    # Doar plasa de siguranta. GitHub executa `schedule` de 4-6 ori pe zi, indiferent cat de des
    # il cerem (masurat 29.09-17.10.2026), deci NU poate fi cadenta. Cadenta (65 min) o da
    # bucla din scripts/ci-loop.sh, iar jobul isi porneste singur succesorul (vezi ultimul pas).
    # 65 min = 176 cereri ASP/zi: limita zilnica per IDNP a respins de la a 182-a cerere cu
    # verificari la 15 min (18.10.2026), deci ~15 min (768/zi) nu incape.
    # Daca lantul se rupe (job anulat de GitHub), un `schedule` il reporneste mai tarziu.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Cat tine bucla, in minute (implicit 320 = 5h20)'
        default: '320'
      interval_seconds:
        description: 'Secunde intre verificari (implicit 3900 = 65 min)'
        default: '3900'
      chain:
        description: 'Porneste automat urmatorul job la final (false = doar test)'
        default: 'true'

# Un singur job ruleaza odata; urmatorul asteapta in coada si porneste imediat dupa. GitHub tine
# cel mult UN job in asteptare (cel mai nou il inlocuieste pe cel vechi), deci un `schedule` care
# cade in timpul unei bucle nu creeaza o a doua bucla paralela.
concurrency:
  group: asp-check
  cancel-in-progress: false

permissions:
  contents: write
  # Pentru `gh workflow run` din ultimul pas (workflow_dispatch pornit cu GITHUB_TOKEN e permis).
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Limita GitHub e 6h; bucla se opreste la 5h20, cu marja pentru ultimul commit + dispatch.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Notificarile invitatilor ruleaza pe Vercel (api/notify-guests.js), nu aici: datele lor
      # sunt criptate cu USER_DATA_KEY, care ramane doar in Vercel. Vezi scripts/ci-loop.sh.
      - name: Bucla de verificare (la 65 min)
        env:
          ASP_IDNP: ${{ secrets.ASP_IDNP }}
          ASP_DOC_SERIES: ${{ secrets.ASP_DOC_SERIES }}
          ASP_DOC_ISSUE_DATE: ${{ secrets.ASP_DOC_ISSUE_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Setarile /setari ale proprietarului (api/owner-prefs.js) + apelul notify-guests.
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '320' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '3900' }}
        run: bash scripts/ci-loop.sh

      # Continua lantul si daca ultima verificare a iesit cu cod 1 (failure), dar NU la anulare
      # manuala (`always()` ar relua jobul pe care tocmai l-ai oprit intentionat).
      - name: Porneste urmatorul job
        if: (success() || failure()) && github.event.inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref "${{ github.ref_name }}"
