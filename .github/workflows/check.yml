name: Verifica locuri ASP

on:
  schedule:
    # Minutul 0 e cel mai incarcat moment global pentru GH Actions (varful orei) --
    # GitHub avertizeaza explicit ca schedule-urile de acolo pot fi intarziate sau
    # sarite. Decalat pe minutul 30 (in afara varfului) -- coincide si cu ora exacta
    # a heartbeat-ului de dimineata (7:30 Europe/Chisinau, fara offset de jumatate
    # de ora fata de UTC, deci minutul UTC = minutul local).
    - cron: '30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: asp-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ruleaza verificarea
        env:
          ASP_IDNP: ${{ secrets.ASP_IDNP }}
          ASP_DOC_SERIES: ${{ secrets.ASP_DOC_SERIES }}
          ASP_DOC_ISSUE_DATE: ${{ secrets.ASP_DOC_ISSUE_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      # `always()` -- daca pasul de verificare iese cu cod 1 (toate categoriile au picat),
      # state-ul (streak-ul de esecuri, rateLimitedUntil) trebuie totusi salvat; fara asta
      # contorul de esecuri nu ajungea niciodata la prag si alerta de esec nu pleca.
      - name: Commit state
        if: always()
        run: |
          git config user.name "asp-programare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/slots.json
          git diff --staged --quiet && exit 0
          git commit -m "state: update [skip ci]"
          git pull --rebase origin master
          git push
